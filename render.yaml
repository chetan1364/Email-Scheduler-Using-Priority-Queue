services:
  - type: web
    name: email-scheduler
    runtime: java
    region: oregon  # or frankfurt if you prefer EU
    plan: free

    # Render builds the fat JAR then starts it
    buildCommand: mvn clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -jar target/email-scheduler-0.0.1-SNAPSHOT.jar

    healthCheckPath: /login

    envVars:
      # ─── Neon PostgreSQL ──────────────────────────────────────────────────
      # Paste your full JDBC URL from neon.tech, e.g.:
      # jdbc:postgresql://ep-xxx.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: NEON_DATABASE_URL
        sync: false    # marks it as a secret — you fill this in via Render dashboard

      # ─── Brevo Email API ──────────────────────────────────────────────────
      - key: BREVO_API_KEY
        sync: false    # fill in via Render dashboard → Environment tab

      - key: BREVO_SENDER_EMAIL
        sync: false    # verified sender email in your Brevo account

      # ─── Spring/JVM tuning for free tier (512 MB RAM) ─────────────────────
      - key: JAVA_OPTS
        value: "-Xmx400m -Xms64m -XX:+UseG1GC"
