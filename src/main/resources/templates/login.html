<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PriorityMail</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center py-5" style="background: radial-gradient(circle at 50% 50%, #111827 0%, #030712 100%);">
    
    <div class="container animate-fade-in" style="max-width: 450px;">
        <div class="text-center mb-4">
            <i class="fa-solid fa-paper-plane text-gradient fs-1 mb-2"></i>
            <h2 class="fw-bold text-gradient">PriorityMail</h2>
            <p class="text-secondary small">Smart Email Scheduling via Priority Queues</p>
        </div>

        <div class="glass-card p-5">
            <h4 class="fw-bold mb-4 text-center">Sign In</h4>
            
            <!-- Success/Error Messages -->
            <div th:if="${param.error}" class="alert alert-danger border-0 bg-danger bg-opacity-20 text-danger rounded-3 py-2 small" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i> Invalid email or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-success border-0 bg-success bg-opacity-20 text-success rounded-3 py-2 small" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i> You have logged out successfully.
            </div>
            <div th:if="${param.registered}" class="alert alert-success border-0 bg-success bg-opacity-20 text-success rounded-3 py-2 small" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i> Registration successful! Sign in now.
            </div>
            <div th:if="${param.resetSuccess}" class="alert alert-success border-0 bg-success bg-opacity-20 text-success rounded-3 py-2 small" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i> Password reset successful.
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-tertiary border-dark text-secondary"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control border-start-0" id="email" name="email" required placeholder="name@domain.com">
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="password" class="form-label">Password</label>
                        <a th:href="@{/reset-password}" class="text-decoration-none small text-secondary hover-accent">Forgot?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-tertiary border-dark text-secondary"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control border-start-0" id="password" name="password" required placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn btn-premium w-100 mb-3" id="login-submit-btn">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
                </button>
            </form>

            <div class="text-center mt-3 small text-secondary">
                Don't have an account? 
                <a th:href="@{/register}" class="text-decoration-none fw-semibold text-light hover-accent">Register here</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
