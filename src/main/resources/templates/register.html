<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PriorityMail</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center py-5" style="background: radial-gradient(circle at 50% 50%, #111827 0%, #030712 100%);">
    
    <div class="container animate-fade-in" style="max-width: 480px;">
        <div class="text-center mb-4">
            <i class="fa-solid fa-user-plus text-gradient fs-1 mb-2"></i>
            <h2 class="fw-bold text-gradient">Create Account</h2>
            <p class="text-secondary small">Begin scheduling with multi-priority delivery pipelines</p>
        </div>

        <div class="glass-card p-5">
            <div th:if="${error}" class="alert alert-danger border-0 bg-danger bg-opacity-20 text-danger rounded-3 py-2 small" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i> <span th:text="${error}">Error details</span>
            </div>

            <!-- Register Form -->
            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-tertiary border-dark text-secondary"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control border-start-0" id="name" th:field="*{name}" required placeholder="John Doe">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-tertiary border-dark text-secondary"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control border-start-0" id="email" th:field="*{email}" required placeholder="john@example.com">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-tertiary border-dark text-secondary"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control border-start-0" id="password" th:field="*{password}" required placeholder="Min 6 characters">
                    </div>
                </div>

                <button type="submit" class="btn btn-premium w-100 mb-3" id="register-submit-btn">
                    <i class="fa-solid fa-user-check me-1"></i> Register Account
                </button>
            </form>

            <div class="text-center mt-3 small text-secondary">
                Already registered? 
                <a th:href="@{/login}" class="text-decoration-none fw-semibold text-light hover-accent">Login here</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
