<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - PriorityMail</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center py-5" style="background: linear-gradient(135deg, #e0f2fe 0%, #f8fafc 50%, #e0e7ff 100%); min-height: 100vh;">
    
    <div class="container animate-fade-in text-center" style="max-width: 500px;">
        <div class="mb-4">
            <i class="fa-solid fa-triangle-exclamation text-danger mb-2" style="font-size: 4.5rem !important;"></i>
            <h2 class="fw-bold text-dark">System Error</h2>
            <p class="text-secondary small" style="color: #475569 !important;">Something went wrong during request processing.</p>
        </div>

        <div class="glass-card p-5 mb-4">
            <div class="alert alert-danger border-0 bg-danger bg-opacity-20 text-danger rounded-3 py-3 mb-4 text-start">
                <i class="fa-solid fa-circle-exclamation me-2"></i>
                <span th:text="${errorMessage != null ? errorMessage : 'An unexpected error has occurred in the application.'}">Error description</span>
            </div>
            
            <p class="text-secondary small mb-4">Please verify your inputs or request parameters and try again. If the issue persists, contact the system administrator.</p>

            <a th:href="@{/dashboard}" class="btn btn-premium w-100" id="error-dashboard-btn">
                <i class="fa-solid fa-house me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
