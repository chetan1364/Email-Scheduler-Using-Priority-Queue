<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(content, currentPage)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriorityMail - Smart Email Scheduler</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="d-flex flex-column min-vh-100">
        <!-- Navigation Header -->
        <nav class="navbar navbar-expand-lg navbar-dark navbar-premium py-3 px-4 sticky-top">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center" th:href="@{/dashboard}">
                    <i class="fa-solid fa-paper-plane text-gradient fs-3 me-2"></i>
                    <span class="fw-bold fs-4 text-gradient">PriorityMail</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item me-3" sec:authorize="isAuthenticated()">
                            <span class="text-secondary">Logged in as: <strong class="text-light" sec:authentication="name">user@email.com</strong></span>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/admin}" class="btn btn-sm btn-outline-warning me-3" id="admin-panel-btn">
                                <i class="fa-solid fa-user-shield me-1"></i> Admin Panel
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-premium" id="logout-btn">
                                    <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container-fluid flex-grow-1">
            <div class="row min-vh-100">
                <!-- Sidebar -->
                <nav class="col-md-3 col-lg-2 d-md-block bg-secondary sidebar collapse py-4 border-end border-dark" style="background-color: var(--bg-secondary) !important;">
                    <div class="position-sticky pt-3 px-3">
                        <a th:href="@{/dashboard}" th:classappend="${currentPage == 'dashboard' ? 'active' : ''}" class="sidebar-link" id="nav-dashboard">
                            <i class="fa-solid fa-house"></i> Dashboard
                        </a>
                        <a th:href="@{/emails/compose}" th:classappend="${currentPage == 'compose' ? 'active' : ''}" class="sidebar-link" id="nav-compose">
                            <i class="fa-solid fa-pen-fancy"></i> Compose Email
                        </a>
                        
                        <div sec:authorize="hasRole('ADMIN')">
                            <hr class="text-secondary" />
                            <div class="small text-secondary fw-bold text-uppercase px-3 mb-2">Administration</div>
                            <a th:href="@{/admin}" th:classappend="${currentPage == 'admin' ? 'active' : ''}" class="sidebar-link" id="nav-admin">
                                <i class="fa-solid fa-chart-line"></i> Analytics & Users
                            </a>
                        </div>
                    </div>
                </nav>

                <!-- Main Content -->
                <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                    <div th:replace="${content}">
                        <!-- Injected Page Content -->
                    </div>
                </main>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
