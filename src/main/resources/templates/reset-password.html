<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - PriorityMail</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center py-5" style="background: linear-gradient(135deg, #e0f2fe 0%, #f8fafc 50%, #e0e7ff 100%); min-height: 100vh;">
    
    <div class="container animate-fade-in" style="max-width: 450px;">
        <div class="text-center mb-4">
            <i class="fa-solid fa-key brand-logo-icon mb-2" style="font-size: 2.5rem !important;"></i>
            <h2 class="brand-logo-text">Password Reset</h2>
            <p class="text-secondary small" style="color: #475569 !important; font-weight: 500;">Set a new password for your account</p>
        </div>

        <div class="glass-card p-5">
            <div th:if="${error}" class="alert alert-danger border-0 bg-danger bg-opacity-20 text-danger rounded-3 py-2 small" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i> <span th:text="${error}">Error details</span>
            </div>

            <!-- Reset Form -->
            <form th:action="@{/reset-password}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border text-secondary"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control border-start-0" id="email" name="email" required placeholder="john@example.com">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border text-secondary"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control border-start-0" id="password" name="password" required placeholder="Enter new password">
                    </div>
                </div>

                <button type="submit" class="btn btn-premium w-100 mb-3" id="reset-submit-btn">
                    <i class="fa-solid fa-rotate me-1"></i> Update Password
                </button>
            </form>

            <div class="text-center mt-3 small text-secondary">
                Back to <a th:href="@{/login}" class="text-decoration-none fw-semibold text-primary hover-accent">Login</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
