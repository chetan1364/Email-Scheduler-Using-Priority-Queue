# Test database configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:email_scheduler_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Dummy Mail Configuration for testing
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=test

# Custom scheduler settings
email.scheduler.cron-interval-seconds=10
email.scheduler.max-retries=3
